services:
  postgres:
    image: postgres:16-alpine
    container_name: trafegoflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trafegoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trafegoflow}
      POSTGRES_DB: ${POSTGRES_DB:-trafegoflow}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trafegoflow}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trafegoflow_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-trafegoflow}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-trafegoflow}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
